<svg width="390" height="300" viewBox="0 0 390 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#173D2D" flood-opacity="0.10"/>
    </filter>

    <style>
      .branch {
        stroke: #C9D8CF;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mid {
        fill: #FFFDF8;
        stroke: #8EB49D;
        stroke-width: 3;
      }
      .end-orange { fill: #FF8B2D; }
      .end-green { fill: #2B6B4B; }
      .end-mint { fill: #DDEDDC; stroke: #8EB49D; stroke-width: 2; }
      .leaf { fill: #2F7A4E; }
      .leaf-line { stroke: #165436; stroke-width: 3; stroke-linecap: round; }
      .face { fill: #2A1D16; }
      .freckle { fill: #F56F2C; }
      .label {
        fill: #1E5F42;
        font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        font-size: 16px;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- branches -->
  <path class="branch" d="M195 146 C195 115 195 89 195 58"/>
  <path class="branch" d="M207 151 C240 132 269 116 303 94"/>
  <path class="branch" d="M209 164 C250 168 287 171 328 177"/>
  <path class="branch" d="M203 176 C228 202 251 220 280 238"/>
  <path class="branch" d="M181 176 C153 204 131 224 101 240"/>
  <path class="branch" d="M179 162 C141 162 106 156 67 145"/>

  <!-- top path: distance 2 -->
  <circle class="mid" cx="195" cy="102" r="7"/>
  <circle class="end-mint" cx="195" cy="58" r="10"/>

  <!-- upper-right path: distance 3 -->
  <circle class="mid" cx="240" cy="132" r="7"/>
  <circle class="mid" cx="271" cy="113" r="7"/>
  <circle class="end-orange" cx="303" cy="94" r="10"/>

  <!-- right path: direct -->
  <circle class="end-green" cx="328" cy="177" r="10"/>

  <!-- lower-right path: distance 2 -->
  <circle class="mid" cx="242" cy="207" r="7"/>
  <circle class="end-mint" cx="280" cy="238" r="10"/>

  <!-- lower-left path: distance 3 -->
  <circle class="mid" cx="159" cy="200" r="7"/>
  <circle class="mid" cx="130" cy="222" r="7"/>
  <circle class="end-orange" cx="101" cy="240" r="10"/>

  <!-- left path: direct -->
  <circle class="end-green" cx="67" cy="145" r="10"/>

  <!-- center mascot -->
  <g filter="url(#softShadow)">
    <ellipse cx="195" cy="161" rx="39" ry="34" fill="#FF8B2D"/>
    <ellipse cx="171" cy="168" rx="9" ry="12" fill="#FF8B2D"/>
    <ellipse cx="219" cy="168" rx="9" ry="12" fill="#FF8B2D"/>
    <ellipse cx="182" cy="191" rx="10" ry="7" fill="#FF8B2D"/>
    <ellipse cx="208" cy="191" rx="10" ry="7" fill="#FF8B2D"/>

    <!-- leaf -->
    <path class="leaf" d="M194 129 C199 111 213 103 229 104 C227 120 214 132 196 136 Z"/>
    <path class="leaf-line" d="M198 131 C207 121 215 114 224 109"/>
    <ellipse cx="195" cy="134" rx="6" ry="4" fill="#1C6440"/>

    <!-- face -->
    <circle class="face" cx="183" cy="159" r="3.5"/>
    <circle class="face" cx="207" cy="159" r="3.5"/>
    <path d="M187 170 C191 176 199 176 203 170" stroke="#2A1D16" stroke-width="3.5" stroke-linecap="round"/>

    <!-- freckles -->
    <circle class="freckle" cx="177" cy="169" r="2.2"/>
    <circle class="freckle" cx="173" cy="174" r="2.0"/>
    <circle class="freckle" cx="181" cy="174" r="1.8"/>
  </g>

  <text class="label" x="195" y="222" text-anchor="middle">나</text>
</svg>
